[project]
name = "captcha-recognition-crnn"
version = "0.1.0"
description = "captcha-recognition-crnn with LACC (EfficientNetV2) + Lightning + Hydra + DVC + MLflow + ONNX + TensorRT + Triton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colored>=2.3.1",
    "dvc>=3.66.1",
    "fire>=0.7.1",
    "hydra-core>=1.3.2",
    "kaggle>=1.8.4",
    "lightning>=2.6.1",
    "lion-pytorch>=0.2.3",
    "matplotlib>=3.10.8",
    "mlflow>=3.9.0",
    "onnxruntime>=1.24.1",
    "onnxscript>=0.6.0",
    "opencv-python>=4.13.0.92",
    "polygraphy>=0.49.26",
    "python-multipart>=0.0.22",
    "tensorrt>=10.15.1.29",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]
